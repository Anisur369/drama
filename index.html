    <title>আমার ভিডিও লাইব্রেরি</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .video-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .video-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 360px;
            max-width: 100%;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-box:hover {
            transform: scale(1.02);
        }
        .media-wrapper {
            position: relative;
            width: 100%;
            height: 202px; /* ১৬:৯ অনুপাত ঠিক রাখার জন্য */
            background: #000;
            border-radius: 5px;
            overflow: hidden;
        }
        .media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .media-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        h3 {
            margin-top: 12px;
            font-size: 17px;
            color: #333;
        }
    </style>
</head>

        const container = document.getElementById("video-list");

        videoDatabase.forEach((video,index) => {
            const box = document.createElement("div");
            box.className = "video-box";
            
            // প্রথমে থাম্বনেইল দেখাবে
            box.innerHTML = `
                <div class="media-wrapper">
                    <img src="https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg" alt="${video.title}">
                    <div class="play-btn">▶</div>
                </div>

            `;

            // ক্লিক করলে নতুন উইন্ডোতে না গিয়ে ওই বক্সেই ভিডিও প্লে হবে
            box.addEventListener("click", function() {
                const wrapper = this.querySelector(".media-wrapper");
                wrapper.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${video.videoId}?autoplay=1" 
                        title="${video.title}" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                `;
            }, { once: true }); // একবার ক্লিক হয়ে ভিডিও লোড হলে আর বারবার রিলোড হবে না

        });
